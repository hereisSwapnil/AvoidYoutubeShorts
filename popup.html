<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avoid YT Shorts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow: hidden;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .version-badge {
            font-size: 10px;
            background: #334155;
            color: #94a3b8;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-badge {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .status-badge.active {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .status-badge.paused {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }

        .stats-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .toggle-label {
            font-size: 12px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #6366f1;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background: #334155;
        }

        .btn.primary {
            background: #6366f1;
            border-color: #6366f1;
            color: white;
        }

        .btn.primary:hover {
            background: #4f46e5;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid #1e293b;
        }

        .footer a {
            color: #818cf8;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title">
            <span>🚫</span>
            <h1>Avoid YT Shorts</h1>
        </div>
        <span class="version-badge">v2.1.0</span>
    </div>

    <div id="status" class="status-badge active">
        🟢 Active &bull; Blocking Shorts
    </div>

    <div class="stats-card">
        <div class="stat-row">
            <span class="stat-label">Shorts Blocked</span>
            <span id="shorts-blocked" class="stat-value">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Shorts Redirected</span>
            <span id="shorts-redirected" class="stat-value">0</span>
        </div>
    </div>

    <div class="toggle-row">
        <span class="toggle-label">Redirect Shorts to Watch Player</span>
        <label class="switch">
            <input type="checkbox" id="redirect-toggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="controls">
        <button id="toggle-btn" class="btn primary">
            Pause Blocker
        </button>
        <div class="btn-group">
            <button id="reset-btn" class="btn">
                Reset Stats
            </button>
            <button id="options-btn" class="btn">
                Settings ⚙️
            </button>
        </div>
    </div>

    <div class="footer">
        <span>Distraction-Free YouTube</span>
        <a href="#" id="open-options-link">Options</a>
    </div>

    <script src="popup.js"></script>
</body>

</html>
